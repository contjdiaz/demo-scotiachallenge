spring.application.name=scotiachallenge

# R2DBC H2 en memoria
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Inicializar esquema desde schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 console (requiere JDBC adicional para la consola web)
spring.h2.console.enabled=true

# Opcional: logs para ver las consultas R2DBC
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info del microservicio
info.app.name=ScotiaChallenge API
info.app.description=Microservicio reactivo para gestion de alumnos
info.app.version=1.0.0
info.app.java-version=${java.version}
info.app.spring-boot-version=3.4.1

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html