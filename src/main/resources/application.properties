spring.application.name=scotiachallenge-api

# R2DBC H2 en memoria
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Inicializar esquema desde schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 console (requiere JDBC adicional para la consola web)
spring.h2.console.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.scotiachallenge=DEBUG

# ============================
# ACTUATOR + PROMETHEUS
# ============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

# Metricas de distribucion (histogramas para latencia)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,500ms

# ============================
# ZIPKIN (Trazabilidad distribuida)
# ============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ============================
# INFO DEL MICROSERVICIO
# ============================
info.app.name=ScotiaChallenge API
info.app.description=Microservicio reactivo para gestion de alumnos
info.app.version=1.0.0
info.app.java-version=${java.version}
info.app.spring-boot-version=3.4.1

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html